name: Pruebas SQLite y HTTP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ejecutar suite sin datos reales
        run: python -m unittest discover -s tests -v
      - name: Validar carga temporal y generar evidencia
        run: python -m scripts.evidencia_s2 --output evidencia_s2_ci.md --count 1000
      - name: Validar instalacion limpia S4
        run: python -m scripts.verify_clean_install_s4 --report evidencia_s4_ci.md
      - name: Adjuntar evidencia de ejecucion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-s2-python-${{ matrix.python-version }}
          path: |
            evidencia_s2_ci.md
            evidencia_s4_ci.md
          if-no-files-found: ignore

  instalacion-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar instalación S4 en Windows
        run: python -m scripts.verify_clean_install_s4 --report evidencia_s4_windows_ci.md
      - name: Comprobar seguridad y respaldo SQLite en Windows
        run: python -m unittest tests.test_s4_security tests.test_s4_backup -v
      - name: Publicar evidencia Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-s4-windows
          path: evidencia_s4_windows_ci.md
          if-no-files-found: ignore
